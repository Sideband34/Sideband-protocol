name: Bug report
description: Something in Sideband-protocol does not work as documented.
title: '[bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security issues** (anything involving keys, funds, replayed or
        forged vouchers) must go through private reporting instead: see SECURITY.md.
        Sideband is Testnet/synthetic only; never paste secret keys or seeds here.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - frames / canonical encoding
        - session state machine
        - metering
        - transport contract / loopback
        - BLE or Wi-Fi adapter (planned)
        - docs
        - other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, inputs or a failing test. Minimal is best.
      placeholder: |
        1. dart pub get
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or tag
      placeholder: e.g. main @ abc1234, or v0.1.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, toolchain versions (Dart package), device if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Redact anything secret.
      render: shell
